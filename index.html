<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fut Coreano - Controle Babá & Jogadores</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <img src="logo.png" alt="Fut Coreano Football Club" class="logo-clube" />
      <h1>Fut Coreano FC</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="financeiro">Financeiro</button>
        <button class="tab-btn" data-tab="jogadores">Jogadores</button>
      </nav>
    </header>

    <!-- MÓDULO FINANCEIRO -->
    <section id="financeiro" class="tab-content active">
      <h2>Controle Financeiro - Babá</h2>

      <form id="form-financeiro" class="card-form">
        <input type="date" id="fin-data" required />
        <select id="fin-tipo" required>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>
        <input type="number" id="fin-valor" step="0.01" placeholder="Valor (R$)" required />
        <input type="text" id="fin-descricao" placeholder="Descrição" required />
        <button type="submit">Adicionar</button>
      </form>

      <div class="saldo-box">
        <span>Saldo atual:</span>
        <strong id="saldo-total">R$ 0,00</strong>
      </div>

      <ul id="lista-financeiro" class="lista"></ul>

      <div class="report-filters">
        <select id="reportType">
          <option value="mensal">Mensal</option>
          <option value="trimestral">Trimestral</option>
          <option value="anual">Anual</option>
        </select>
        <button id="btn-baixar-relatorio" class="btn-relatorio">Baixar relatório</button>
      </div>

      <div id="relatorio-preview" style="position: absolute; left: -9999px; top: 0;">
        <div id="relatorio-conteudo" style="width: 800px; padding: 40px; font-family: Arial, sans-serif; background: #ffffff;"></div>
      </div>
    </section>

    <!-- MÓDULO JOGADORES -->
    <section id="jogadores" class="tab-content">
      <h2>Jogadores de Futebol</h2>

      <form id="form-jogador" class="card-form">
        <input type="text" id="jog-nome" placeholder="Nome do jogador" required />
        <input type="number" id="jog-gols" placeholder="Número de gols" min="0" required />
        <button type="submit">Cadastrar</button>
      </form>

      <!-- Botão temporário: usar uma única vez para popular o banco -->
      <button id="btn-popular-jogadores" class="btn-relatorio">Popular jogadores (usar 1x)</button>

      <button id="btn-baixar-imagem" class="btn-download">Baixar tabela de artilharia</button>

      <ul id="lista-jogadores" class="lista"></ul>
    </section>

    <!-- PREVIEW DA TABELA DE ARTILHARIA (estilo Instagram) -->
    <div id="stories-preview" class="stories-preview">
      <div class="stories-header">
        <h2 class="stories-titulo-principal">TABELA DE<br>ARTILHARIA</h2>
        <span id="stories-data" class="stories-data"></span>
      </div>
      <table class="tabela-artilharia">
        <thead>
          <tr>
            <th>POS</th>
            <th>ATLETA</th>
            <th>GOLS</th>
          </tr>
        </thead>
        <tbody id="lista-jogadores-stories"></tbody>
      </table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
